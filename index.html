px; color: var(--color-neutral-700); line-height: 1.6;\">Захиалга <b>#{{ orderNo }}<\u002Fb> — төлбөр баталгаажмагц AI бүрэн тайлан (PDF) <b>{{ email }}<\u002Fb> хаяг руу илгээгдэнэ. Гүйлгээний утга дээр имэйл хаягаа бичсэн эсэхээ шалгаарай — бид түүгээр таны төлбөрийг таньж баталгаажуулна.<\u002Fdiv>\n                <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ viewReport }}\" style=\"font-size: 16px; padding: 14px 24px;\">Тайлангаа онлайнаар үзэх →<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;: {&quot;width&quot;: 1280, &quot;height&quot;: 900}, &quot;price&quot;: {&quot;editor&quot;: &quot;int&quot;, &quot;default&quot;: 9900, &quot;tsType&quot;: &quot;number&quot;, &quot;min&quot;: 0, &quot;max&quot;: 100000, &quot;step&quot;: 100, &quot;section&quot;: &quot;Төлбөр&quot;}, &quot;demoUnlock&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Демо&quot;}}\">\nconst PILLARS = [\n  { key: 'health', name: 'Эрүүл мэнд' },\n  { key: 'mental', name: 'Сэтгэл зүй' },\n  { key: 'finance', name: 'Санхүү' },\n  { key: 'career', name: 'Карьер' },\n  { key: 'relationship', name: 'Харилцаа' },\n  { key: 'social', name: 'Нийгэм' },\n  { key: 'growth', name: 'Хөгжил' },\n  { key: 'purpose', name: 'Зорилго' },\n];\n\nconst QUESTIONS = [\n  // Эрүүл мэнд\n  { p: 0, text: 'Та долоо хоногт хэр олон удаа хөдөлгөөн хийдэг вэ?', hook: 'Тогтмол хөдөлгөөн нь эрт нас барах эрсдэлийг 30% хүртэл бууруулдаг — энэ бол хамгийн хямд “эм”.', labels: ['😴 Огт хийдэггүй', '🚶 Хааяа нэг алхдаг', '🏃 Долоо хоногт 1–2 удаа', '💪 3–4 удаа', '🔥 Бараг өдөр бүр'] },\n  { p: 0, text: 'Та шөнөдөө сайн унтаж, сэргэг сэрж чаддаг уу?', hook: '7 цагаас бага унтдаг хүний шийдвэр гаргах чадвар согтуу хүнийхтэй ойролцоо болдог гэдгийг судалгаа харуулсан.', labels: ['🧟 Байнга ядарсан сэрдэг', '😪 Ихэвчлэн дутуу', '😐 Дунд зэрэг', '😌 Ихэвчлэн сайн', '🛌 Гүн, сэргэг сэрдэг'] },\n  { p: 0, text: 'Та эрүүл хооллохыг хичээдэг үү?', hook: 'Таны тархины 20% энерги хоолноос шууд хамаардаг — юу идэж байгаа чинь юу бодохыг чинь тодорхойлдог.', labels: ['🍟 Юу таарна түүгээр', '🍕 Түргэн хоол давамгай', '🥪 Хагас хагасаар', '🥗 Ихэвчлэн эрүүл', '🌱 Маш ухамсартай'] },\n  // Сэтгэл зүй\n  { p: 1, text: 'Стресс ирэхэд та тайвширч чаддаг уу?', hook: 'Архаг стресс нь дархлааг сулруулж, ой тогтоолтын төвийг физикээр багасгадаг — удирдаж сурах нь ур чадвар.', labels: ['🌋 Байнга дарамтанд', '😫 Ихэнхдээ давалгаанд', '🌊 Дээш доош', '🧘 Ихэвчлэн тайван', '🏔 Тогтвортой тайван'] },\n  { p: 1, text: 'Таны сэтгэл санаа ихэвчлэн ямар байдаг вэ?', hook: 'Сэтгэлийн тогтвортой байдал нь орлого, харилцаа, эрүүл мэндийн урт хугацааны хамгийн хүчтэй урьдчилан таамаглагч юм.', labels: ['🎢 Роллер коастер шиг', '⛈ Ихэвчлэн хэлбэлздэг', '⛅ Дунд зэрэг', '☀️ Ихэвчлэн эерэг', '🌈 Маш тогтвортой'] },\n  { p: 1, text: 'Та өөртөө зориулж амрах цаг гаргадаг уу?', hook: '“Юу ч хийхгүй” цаг нь тархины default network-ийг асааж, бүтээлч шийдлүүд яг тэнд төрдөг.', labels: ['🌀 Хэзээ ч үгүй', '⏳ Маш ховор', '🕯 Заримдаа', '🍵 Долоо хоног бүр', '🧘‍♂️ Өдөр бүр'] },\n  // Санхүү\n  { p: 2, text: 'Та мөнгөө хаана зарцуулж байгаагаа мэддэг үү?', hook: 'Мөнгөө хянадаг хүмүүс хянадаггүй хүмүүсээс дунджаар 2 дахин хурдан хуримтлал үүсгэдэг.', labels: ['🙈 Огт хардаггүй', '😬 Сар дуусахад л', '📝 Заримдаа бүртгэдэг', '📊 Сар бүр төсөвтэй', '🧮 Бүх зүйл бүртгэлтэй'] },\n  { p: 2, text: 'Гэнэт мөнгө хэрэг болбол танд нөөц бий юу?', hook: '3 сарын зардлын хуримтлал нь санхүүгийн стрессийг хамгийн эрс бууруулдаг нэг тоо.', labels: ['🕳 Огт байхгүй', '💸 Хэдхэн хоногийнх', '👛 1 сар орчим', '💰 2–3 сарынх', '🏦 3+ сарынх'] },\n  { p: 2, text: 'Та ирээдүйдээ зориулж мөнгө хадгалдаг уу?', hook: 'Давхар өсөлт — эрт эхэлсэн жижиг дүн нь хожуу эхэлсэн том дүнг гүйцдэг.', labels: ['🚫 Огт үгүй', '🌱 Дөнгөж бодож байгаа', '🪙 Заримдаа хийдэг', '📈 Тогтмол хийдэг', '🚀 Стратегитай хийдэг'] },\n  // Карьер\n  { p: 3, text: 'Таны ажил танд таалагддаг уу?', hook: 'Хүн амьдралынхаа 90,000 цагийг ажилдаа зарцуулдаг — тэр цаг утгатай байх ёстой.', labels: ['🪫 Зүгээр л тэвчиж байна', '😑 Ихэнхдээ уйтгартай', '⚖️ Дунд зэрэг', '✨ Ихэвчлэн урамтай', '🎯 Яг миний зам'] },\n  { p: 3, text: 'Та ажил дээрээ өсөж байна гэж мэдэрдэг үү?', hook: 'Өсөлт зогссон мэдрэмж нь ажлаас гарах хүслийн №1 шалтгаан — цалингаас ч илүү.', labels: ['🧊 Зогсонги байна', '🐌 Маш удаан', '🚶 Жаахан ахидаг', '🏃 Тогтмол өсч байна', '🚀 Хурдацтай өсч байна'] },\n  { p: 3, text: 'Та ажил, амралтаа тэнцвэртэй авч явж чаддаг уу?', hook: 'Burnout нь ДЭМБ-ын албан ёсны оношлогдох үзэгдэл болсон — тэнцвэр бол сул тал биш, стратеги.', labels: ['🔥 Шатаж дууссан', '😮‍💨 Ихэвчлэн ажил давамгай', '⚖️ Хааяа алддаг', '🌿 Ихэвчлэн тэнцвэртэй', '🏝 Маш сайн барьдаг'] },\n  // Харилцаа\n  { p: 4, text: 'Та хамгийн ойр хүмүүстэйгээ хэр дотно вэ?', hook: 'Харвардын 85 жилийн судалгааны дүгнэлт: аз жаргалын №1 таамаглагч бол харилцааны чанар.', labels: ['🏝 Тусгаарлагдсан', '📱 Гадарга дээр л', '🤝 Дунд зэрэг', '❤️ Гүн холбоотой', '🫂 Маш гүн, итгэлтэй'] },\n  { p: 4, text: 'Та хайртай хүмүүстээ цаг гаргаж чаддаг уу?', hook: 'Харилцаа бол данс шиг — тогтмол “хадгаламж” хийхгүй бол хоосрол хуримтлагддаг.', labels: ['⏰ Бараг гаргадаггүй', '😔 Хүсдэг ч амждаггүй', '📅 Заримдаа', '💐 Долоо хоног бүр', '🌟 Тэргүүн зэрэглэлд тавьдаг'] },\n  { p: 4, text: 'Санал зөрөхөд та ярилцаж шийддэг үү?', hook: 'Судалгаагаар салалтыг таамагладаг зүйл нь хэрүүл биш — дарагдсан, яриагүй дургүйцэл юм.', labels: ['🌋 Дарж хуримтлуулдаг', '🙊 Ихэвчлэн зайлсхийдэг', '😤 Заримдаа ярьдаг', '🗣 Ихэвчлэн ярилцдаг', '🕊 Үргэлж нээлттэй шийддэг'] },\n  // Нийгэм\n  { p: 5, text: 'Та найзуудтайгаа хэр олон уулздаг вэ?', hook: 'Ганцаардал нь өдөрт 15 янжуур татахтай тэнцэх эрүүл мэндийн эрсдэл гэж судлаачид үздэг.', labels: ['🏚 Бараг уулздаггүй', '🌫 Хэдэн сард нэг', '☕ Сард нэг орчим', '🍜 Долоо хоног бүр', '🎉 Байнга холбоотой'] },\n  { p: 5, text: 'Хэцүү үед туслах хүн танд бий юу?', hook: 'Хэцүү үед түшиж болох 3 хүн байх нь стрессийн нөлөөг эрс зөөлрүүлдэг.', labels: ['🚪 Хэн ч алга', '🤔 Магадгүй 1 хүн', '👥 2–3 хүн бий', '🛟 Найдвартай хүрээлэлтэй', '🏰 Хүчтэй дэмжлэгтэй'] },\n  { p: 5, text: 'Та шинэ хүмүүстэй танилцах дуртай юу?', hook: 'Шинэ боломжуудын ихэнх нь ойрын биш, “сул холбоос” буюу таны танилын танилаас ирдэг.', labels: ['🐚 Огт үгүй', '😶 Маш ховор', '👋 Заримдаа', '🤝 Тогтмол танилцдаг', '🌐 Идэвхтэй тэлдэг'] },\n  // Хөгжил\n  { p: 6, text: 'Та шинэ зүйл сурахад цаг гаргадаг уу?', hook: 'Суралцах хурд бол шинэ “цалин” — хамгийн амжилттай хүмүүс өдөр бүр уншиж, суралцдаг.', labels: ['📵 Огт сурдаггүй', '🥱 Хааяа нэг', '📖 Сард хэдэн цаг', '📚 Долоо хоног бүр', '🧠 Өдөр бүр сурдаг'] },\n  { p: 6, text: 'Та тавьсан зорилгоо биелүүлж чаддаг уу?', hook: 'Амжилт нь урам зоригоос биш — өдөр бүр давтагддаг жижиг системээс бүтдэг гэж James Clear нотолсон.', labels: ['🎈 Зорилго тавьдаггүй', '📃 Тавьдаг ч мартдаг', '🔁 Заримдаа хэрэгжүүлдэг', '📆 Системтэй хөтөлдөг', '⚙️ Дадал болгож чадсан'] },\n  { p: 6, text: 'Та шинэ зүйл туршиж, сорилт хийж үздэг үү?', hook: 'Тархи зөвхөн “эвгүй” мэдрэмжийн бүсэд шинэ мэдрэлийн холбоо үүсгэдэг — өсөлт тэнд л болдог.', labels: ['🛋 Хэзээ ч гардаггүй', '😅 Маш ховор', '🚪 Заримдаа', '🧗 Тогтмол сорьдог', '⚡ Байнга сорилттой амьдардаг'] },\n  // Зорилго\n  { p: 7, text: 'Та юуны төлөө амьдарч байгаагаа мэддэг үү?', hook: 'Ikigai буюу оршихуйн утгатай хүмүүс дунджаар 7 жил урт насалдаг гэж Окинавагийн судалгаа харуулжээ.', labels: ['🌫 Огт мэдэхгүй', '❓ Бүрхэг', '🧭 Ерөнхийдөө гадарладаг', '🗺 Нэлээд тодорхой', '💎 Маш тодорхой'] },\n  { p: 7, text: 'Өдөр тутмын амьдрал тань зорилготой тань нийцдэг үү?', hook: 'Зорилго ба өдөр тутмын зөрүү нь “busy but empty” буюу завгүй ч хоосон мэдрэмжийн эх үүсвэр.', labels: ['🎲 Огт уялддаггүй', '🌪 Ихэвчлэн урсгалаар', '🔗 Хааяа уялддаг', '🧩 Ихэвчлэн уялддаг', '🎯 Бүрэн уялдсан'] },\n  { p: 7, text: 'Та бусдад тусалж, хувь нэмэр оруулдаг уу?', hook: 'Бусдад туслах үйлдэл нь тархинд “helper’s high” үүсгэж, сэтгэл ханамжийг хамгийн урт хадгалдаг.', labels: ['🪞 Зөвхөн өөртөө', '🤷 Бараг үгүй', '🎗 Заримдаа', '🤲 Тогтмол оруулдаг', '🌍 Амьдралын минь хэсэг'] },\n];\n\nconst ADVICE = {\n  health: {\n    low: 'Бие махбод тань дэмжлэг хүсч байна. Өдөрт 20 минутын алхалтаас эхлээрэй — хамгийн энгийн, хамгийн үр дүнтэй эхлэл.',\n    mid: 'Суурь сайн байна. Одоо унтах цаг болон хоолны дэглэмээ жигдрүүлбэл оноо тань хурдан өснө.',\n    high: 'Маш сайн! Одоогийн дадлаа хадгалаад, жилийн эрүүл мэндийн үзлэгээ мартуузай.' },\n  mental: {\n    low: 'Сэтгэл санаа тань анхаарал хүсч байна. Өдөрт 10 минут утасгүй, чимээгүй цаг гаргахаас эхлээрэй.',\n    mid: 'Стрессээ ерөнхийдөө удирдаж байна. Амралтын цагаа урьдчилан төлөвлөвөл тогтвортой байдал нэмэгдэнэ.',\n    high: 'Сэтгэлийн тогтвортой байдал тань бусад бүх салбарын суурь болж байна. Үргэлжлүүлээрэй!' },\n  finance: {\n    low: 'Мөнгөний урсгалаа харахаас бүх зүйл эхэлдэг. Энэ сард зөвхөн зарлагаа бүртгээрэй — өөрчлөх шаардлагагүй, зөвхөн харах.',\n    mid: 'Хяналт байна, одоо хуримтлалын ээлж. Орлогынхоо 10%-ийг автоматаар тусад нь шилжүүлж эхлээрэй.',\n    high: 'Санхүүгийн сахилга бат тань өндөр байна. Дараагийн алхам — урт хугацааны хөрөнгө оруулалтын стратеги.' },\n  career: {\n    low: 'Ажил тань энерги өгөхийн оронд авч байж магадгүй. Юу таныг урамшуулдгийг бичиж, жижиг өөрчлөлтөөс эхлээрэй.',\n    mid: 'Тогтвортой байна. Улирал бүр нэг шинэ ур чадвар сурах зорилт тавьбал өсөлт мэдрэгдэнэ.',\n    high: 'Карьер тань зөв замдаа байна. Одоо бусдад mentor болох нь таны өсөлтийг дараагийн түвшинд гаргана.' },\n  relationship: {\n    low: 'Ойр дотны холбоо тань суларсан байж магадгүй. Долоо хоногт нэг чанартай, утасгүй уулзалтаас эхлээрэй.',\n    mid: 'Холбоо сайн байна. Талархлаа илүү олон удаа хэлж илэрхийлбэл харилцаа улам гүнзгийрнэ.',\n    high: 'Харилцаа тань таны хамгийн том хөрөнгө. Үүнийг хамгаалж, тогтмол цаг гаргасаар байгаарай.' },\n  social: {\n    low: 'Ганцаардал аажмаар хуримтлагддаг. Энэ сард нэг найздаа залгаж, уулзалт товлохоос эхлээрэй.',\n    mid: 'Хүрээлэл тань дунд зэрэг идэвхтэй. Сард 2 удаагийн тогтмол уулзалт товлох нь хамгийн хялбар алхам.',\n    high: 'Нийгмийн холбоо тань хүчтэй байна — энэ нь стрессийн үед таны хамгаалалт болдог.' },\n  growth: {\n    low: 'Өсөлт зогссон мэдрэмж хэнд ч ирдэг. Өдөрт 15 минут унших жижиг дадал л том өөрчлөлтийн эхлэл.',\n    mid: 'Суралцах хүсэл байна. Тодорхой нэг чиглэл сонгож 90 хоног төвлөрвөл үр дүн нь мэдрэгдэнэ.',\n    high: 'Та тасралтгүй суралцагч байна. Сурснаа бусадтай хуваалцах нь ойлголтыг тань улам гүнзгийрүүлнэ.' },\n  purpose: {\n    low: '“Яагаад” гэдгээ олох нь аялал — өдөр бүр 5 минут “өнөөдөр юу утгатай байв” гэж бичихээс эхлээрэй.',\n    mid: 'Чиглэл тань ерөнхийдөө тодорхой байна. Урт хугацааны зорилгоо бичиж, сар бүр эргэж хараарай.',\n    high: 'Тодорхой зорилготой амьдрал — таны хамгийн том давуу тал. Энэ нь бусад салбарыг тань чиглүүлж байна.' },\n};\n\nconst FOCUS_REASONS = {\n  health: 'Эрүүл мэнд бол бусад бүх салбарын эрчим хүчний эх үүсвэр — энд оруулсан хөрөнгө хамгийн хурдан үр дүнгээ өгдөг.',\n  mental: 'Сэтгэл зүй доогуур үед бусад салбарын амжилт ч мэдрэгддэггүй — эндээс эхлэх нь бүх зүйлийг хөнгөвчилнө.',\n  finance: 'Санхүүгийн стресс нь нойр, харилцаа, ажлын бүтээмжид шууд нөлөөлдөг — энэ салбарыг өргөх нь дам нөлөөгөөр бусдыг өргөнө.',\n  career: 'Сэрүүн цагийн тань ихэнх нь ажилд өнгөрдөг тул энд гарсан ахиц амьдралын бүх хэсэгт мэдрэгдэнэ.',\n  relationship: 'Судалгаагаар урт хугацааны аз жаргалын №1 таамаглагч бол ойр дотны харилцааны чанар юм.',\n  social: 'Дэмжлэгтэй хүрээлэл нь стрессийн нөлөөг зөөлрүүлж, шинэ боломжийн эх үүсвэр болдог.',\n  growth: 'Өсөлтийн мэдрэмж нь урам зориг, өөртөө итгэх итгэлийн гол тэжээл — энд ахиц гарвал бусад нь дагана.',\n  purpose: 'Зорилго тодорхой болмогц өдөр тутмын шийдвэрүүд хөнгөрч, бусад салбарын оноо аяндаа өсдөг.',\n};\n\nconst LABELS = [\n  { min: 0, label: 'Анхаарал шаардлагатай', desc: 'Хэд хэдэн салбарт яаралтай өөрчлөлт хэрэгтэй байна. Сайн мэдээ: хамгийн доод цэгээс өсөлт хамгийн хурдан байдаг.' },\n  { min: 40, label: 'Хөгжиж буй', desc: 'Суурь тавигдсан ч тэнцвэр алдагдсан салбарууд байна. Нэг салбарт төвлөрвөл нийт оноо хурдан өснө.' },\n  { min: 60, label: 'Тогтвортой', desc: 'Таны амьдралын суурь тогтвортой байна. Одоо сул талууд дээрээ зорилтот ажиллах үе.' },\n  { min: 75, label: 'Сайн', desc: 'Ихэнх салбарт хүчтэй байна. Дараагийн түвшинд гарахад нарийвчилсан стратеги хэрэгтэй.' },\n  { min: 88, label: 'Маш сайн', desc: 'Та дээд 5%-д байна. Одоо гол сорилт — үүнийг урт хугацаанд хадгалах систем.' },\n];\n\nconst GOALS = {\n  health: 'Долоо хоногт 3 удаа, 30 минутын хөдөлгөөнийг хуанлидаа тогтмол цаг болгон оруул.',\n  mental: 'Өдөр бүр 10 минутын дэлгэцгүй, тайван цагийг өглөөний дадал болго.',\n  finance: 'Энэ сард бүх зарлагаа бүртгэж, дараа сарын төсвөө урьдчилан гарга.',\n  career: 'Карьерийн 1 жилийн зорилгоо бичиж, долоо хоног бүр 1 алхам хий.',\n  relationship: 'Хамгийн ойр хүнтэйгээ долоо хоног бүр утасгүй, 1 цагийн чанартай уулзалт хий.',\n  social: 'Сард 2 удаа найз нөхөдтэйгөө уулзах товыг урьдчилан тавь.',\n  growth: 'Өдөр бүр 20 минут ном унших эсвэл сургалт үзэх дадал эхлүүл.',\n  purpose: 'Долоо хоног бүр “энэ долоо хоног юу утгатай байв” гэсэн 5 минутын тэмдэглэл хөтөл.',\n};\n\nclass Component extends DCLogic {\n  state = {\n    view: 'landing',\n    name: '', age: '', phone: '', gender: -1,\n    qIndex: 0, answers: {},\n    loadingStep: 0,\n    payState: 'closed', // closed | form | checking | sent\n    unlocked: false,\n    email: '', payError: '',\n    adminAuthed: false, adminUser: '', adminPass: '', adminError: '',\n    orderNo: Math.floor(100000 + Math.random() * 900000),\n  };\n\n  go(view) { this.setState({ view }); window.scrollTo(0, 0); }\n\n  componentDidMount() {\n    if (localStorage.getItem('mls_admin_authed') === '1') this.setState({ adminAuthed: true });\n  }\n\n  computeOverall(scores) {\n    let overall = Math.round(scores.reduce((a, b) => a + b, 0) / 8);\n    const critical = scores.filter(s => s < 35).length;\n    return Math.max(0, overall - critical * 3);\n  }\n\n  startLoading() {\n    try {\n      const scores = this.pillarScores();\n      const hist = JSON.parse(localStorage.getItem('mls_history') || '[]');\n      hist.push({ date: new Date().toLocaleDateString('sv-SE'), overall: this.computeOverall(scores), scores });\n      localStorage.setItem('mls_history', JSON.stringify(hist));\n    } catch (e) {}\n    this.setState({ view: 'loading', loadingStep: 0 });\n    window.scrollTo(0, 0);\n    const msgs = 4;\n    let i = 0;\n    const t = setInterval(() => {\n      i++;\n      if (i >= msgs) { clearInterval(t); this.go('result'); }\n      else this.setState({ loadingStep: i });\n    }, 1100);\n  }\n\n  pillarScores() {\n    const sums = PILLARS.map(() => ({ s: 0, n: 0 }));\n    QUESTIONS.forEach((q, i) => {\n      const a = this.state.answers[i];\n      if (a) { sums[q.p].s += a; sums[q.p].n++; }\n    });\n    return sums.map(x => x.n ? Math.round((x.s / x.n - 1) / 4 * 100) : 0);\n  }\n\n  renderVals() {\n    const st = this.state;\n    const price = this.props.price ?? 9900;\n    const priceFmt = price.toLocaleString('en-US').replace(/,/g, \"'\");\n    const q = QUESTIONS[st.qIndex] || QUESTIONS[0];\n\n    const segStyle = (sel) => `flex:1; cursor:pointer; padding:10px 12px; font-family:var(--font-body); font-size:14px; border:2px solid ${sel ? 'var(--color-accent)' : 'var(--color-divider)'}; background:${sel ? 'var(--color-accent-100)' : 'var(--color-bg)'}; color:var(--color-text); text-align:left;`;\n\n    const genderOpts = ['Эрэгтэй', 'Эмэгтэй', 'Бусад'].map((label, i) => ({\n      label, style: segStyle(st.gender === i), pick: () => this.setState({ gender: i }),\n    }));\n    let subs = [];\n    try { subs = JSON.parse(localStorage.getItem('mls_submissions') || '[]'); } catch (e) { subs = []; }\n    const STATUS = {\n      pending: { label: 'Хүлээгдэж буй', color: 'var(--color-accent)', action: 'Төлсөн ✓' },\n      paid: { label: 'Төлсөн', color: 'var(--color-neutral-700)', action: 'Илгээсэн ✉' },\n      sent: { label: 'Илгээсэн', color: 'var(--color-accent-700)', action: 'Буцаах ↺' },\n    };\n    const submissions = [...subs].reverse().map((s) => {\n      const def = STATUS[s.status] || STATUS.pending;\n      return {\n        ...s,\n        statusLabel: def.label, statusColor: def.color, actionLabel: def.action,\n        rowBg: this.state.selectedOrder === s.orderNo ? 'var(--color-accent-100)' : 'transparent',\n        select: () => this.setState({ selectedOrder: this.state.selectedOrder === s.orderNo ? null : s.orderNo }),\n        advance: () => {\n          const next = s.status === 'pending' ? 'paid' : s.status === 'paid' ? 'sent' : 'pending';\n          const updated = subs.map(x => x.orderNo === s.orderNo ? { ...x, status: next } : x);\n          localStorage.setItem('mls_submissions', JSON.stringify(updated));\n          this.forceUpdate();\n        },\n      };\n    });\n\n    const selected = st.answers[st.qIndex];\n    const likert = q.labels.map((label, i) => {\n      const n = i + 1;\n      const sel = selected === n;\n      return {\n        n, label,\n        style: `display:flex; align-items:center; gap:14px; width:100%; box-sizing:border-box; text-align:left; cursor:pointer; padding:16px 18px; font-family:var(--font-body); font-size:16px; color:var(--color-text); border:2px solid ${sel ? 'var(--color-accent)' : 'var(--color-divider)'}; background:${sel ? 'var(--color-accent-100)' : 'var(--color-bg)'}; transition: border-color .15s, background .15s;`,\n        pick: () => {\n          this.setState({ answers: { ...st.answers, [st.qIndex]: n } });\n          setTimeout(() => {\n            if (this.state.qIndex < QUESTIONS.length - 1) {\n              this.setState({ qIndex: this.state.qIndex + 1 });\n              window.scrollTo(0, 0);\n            } else {\n              this.startLoading();\n            }\n          }, 280);\n        },\n      };\n    });\n\n    const scores = this.pillarScores();\n    const answered = Object.keys(st.answers).length;\n    const overall = this.computeOverall(scores);\n\n    // history & month-over-month comparison\n    let hist = [];\n    try { hist = JSON.parse(localStorage.getItem('mls_history') || '[]'); } catch (e) {}\n    const prev = hist.length >= 2 ? hist[hist.length - 2] : null;\n    const hasPrev = !!prev && st.view === 'result';\n    const deltaOf = (d) => d > 0 ? `+${d}` : d < 0 ? `−${Math.abs(d)}` : '±0';\n    const colorOf = (d) => d > 0 ? 'oklch(0.52 0.14 150)' : d < 0 ? 'oklch(0.55 0.21 27)' : 'var(--color-neutral-600)';\n    const prevRadarPoints = (prev ? prev.scores : scores.map(() => 0)).map((s, i) => {\n      const ang = (i * 45 - 90) * Math.PI / 180;\n      const r = Math.max(6, s / 100 * 120);\n      return `${(150 + r * Math.cos(ang)).toFixed(1)},${(150 + r * Math.sin(ang)).toFixed(1)}`;\n    }).join(' ');\n    const compareRows = prev ? PILLARS.map((p, i) => {\n      const d = scores[i] - (prev.scores[i] || 0);\n      return { name: p.name, prev: prev.scores[i] || 0, cur: scores[i], delta: deltaOf(d), deltaColor: colorOf(d), arrow: d > 0 ? '▲' : d < 0 ? '▼' : '—' };\n    }) : [];\n    const histSlice = hist.slice(-6);\n    const histMax = Math.max(1, ...histSlice.map(h => h.overall));\n    const historyBars = histSlice.map(h => ({ label: (h.date || '').slice(5), overall: h.overall, hPx: Math.max(8, Math.round(h.overall / histMax * 72)) }));\n    const labelDef = [...LABELS].reverse().find(l => overall >= l.min) || LABELS[0];\n\n    // radar points\n    const pts = scores.map((s, i) => {\n      const ang = (i * 45 - 90) * Math.PI / 180;\n      const r = Math.max(6, s / 100 * 120);\n      return `${(150 + r * Math.cos(ang)).toFixed(1)},${(150 + r * Math.sin(ang)).toFixed(1)}`;\n    }).join(' ');\n\n    const ranked = PILLARS.map((p, i) => ({ name: p.name, key: p.key, score: scores[i] })).sort((a, b) => b.score - a.score);\n    const strengths = ranked.slice(0, 3);\n    const weaknesses = [...ranked].reverse().slice(0, 3);\n    const priority = weaknesses[0] || ranked[0];\n\n    const firstName = st.name.trim() || 'Таны';\n    const aiSummary = `${firstName === 'Таны' ? 'Таны' : firstName + ' — таны'} нийт Life Score ${overall} буюу “${labelDef.label}” түвшинд байна.\\n\\nХамгийн хүчтэй тал тань ${strengths[0]?.name} (${strengths[0]?.score} оноо) — энэ бол таны бусад салбарыг өргөх хөшүүрэг. Харин ${priority.name} (${priority.score} оноо) хамгийн их анхаарал шаардаж байна: энэ салбар доогуур байх нь бусад 7 салбарын өсөлтийг далд байдлаар удаашруулдаг.\\n\\nЭхний 30 хоногт зөвхөн нэг зүйлд төвлөр: ${GOALS[priority.key]} Судалгаагаар нэг салбарт 90 хоног төвлөрсөн хүмүүсийн нийт оноо дунджаар 9–14 пунктээр өсдөг.\\n\\nДараагийн үнэлгээгээ 30 хоногийн дараа хийж, ахицаа хэмжээрэй.`;\n\n    const loadingMsgs = ['Таны үр дүнг боловсруулж байна...', 'Асуултуудыг шинжилж байна...', 'AI зөвлөгөө бэлдэж байна...', 'Тайлан бэлэн боллоо.'];\n\n    const navHints = { landing: 'ТАНЫ АМЬДРАЛЫН КРЕДИТ ОНОО', admin: 'АДМИН', info: 'ҮНЭЛГЭЭ', quiz: `АСУУЛТ ${st.qIndex + 1}/${QUESTIONS.length}`, loading: 'БОЛОВСРУУЛЖ БАЙНА', result: 'ТАНЫ ҮР ДҮН' };\n\n    return {\n      isLanding: st.view === 'landing',\n      isInfo: st.view === 'info',\n      isQuiz: st.view === 'quiz',\n      isLoading: st.view === 'loading',\n      isResult: st.view === 'result',\n      isAdmin: st.view === 'admin' && st.adminAuthed,\n      isAdminLogin: st.view === 'adminLogin' || (st.view === 'admin' && !st.adminAuthed),\n      goAdmin: () => this.go(st.adminAuthed ? 'admin' : 'adminLogin'),\n      adminUser: st.adminUser, adminPass: st.adminPass, adminError: st.adminError,\n      setAdminUser: (e) => this.setState({ adminUser: e.target.value, adminError: '' }),\n      setAdminPass: (e) => this.setState({ adminPass: e.target.value, adminError: '' }),\n      adminLogin: () => {\n        if (st.adminUser.trim() === 'admin' && st.adminPass === 'mls2026') {\n          localStorage.setItem('mls_admin_authed', '1');\n          this.setState({ adminAuthed: true, adminError: '', adminPass: '' });\n          this.go('admin');\n        } else {\n          this.setState({ adminError: 'Нэвтрэх нэр эсвэл нууц үг буруу байна.' });\n        }\n      },\n      hasDetail: (() => !!subs.find(x => x.orderNo === st.selectedOrder) && st.view === 'admin')(),\n      detail: (() => {\n        const d = subs.find(x => x.orderNo === st.selectedOrder) || {};\n        const def = STATUS[d.status] || STATUS.pending;\n        return { ...d, statusLabel: def.label };\n      })(),\n      detailPillars: (() => {\n        const d = subs.find(x => x.orderNo === st.selectedOrder);\n        if (!d || !d.scores) return [];\n        return PILLARS.map((p, i) => ({ name: p.name, score: d.scores[i] || 0 }));\n      })(),\n      closeDetail: () => this.setState({ selectedOrder: null }),\n      detailHasQA: (() => {\n        const d = subs.find(x => x.orderNo === st.selectedOrder);\n        return !!(d && d.answers && Object.keys(d.answers).length);\n      })(),\n      detailQA: (() => {\n        const d = subs.find(x => x.orderNo === st.selectedOrder);\n        if (!d || !d.answers) return [];\n        return PILLARS.map((p, pi) => ({\n          name: p.name,\n          score: (d.scores && d.scores[pi] != null) ? d.scores[pi] : '—',\n          items: QUESTIONS.map((q, qi) => ({ q, qi })).filter(x => x.q.p === pi).map(x => {\n            const val = d.answers[x.qi];\n            return { text: x.q.text, val: val || '—', label: val ? x.q.labels[val - 1] : 'Хариулаагүй' };\n          }),\n        }));\n      })(),\n      seedDemo: () => {\n        const names = [['Болор', 'Эмэгтэй', 24], ['Тэмүүлэн', 'Эрэгтэй', 31], ['Сарнай', 'Эмэгтэй', 28], ['Бат-Эрдэнэ', 'Эрэгтэй', 42], ['Номин', 'Эмэгтэй', 22], ['Ганзориг', 'Эрэгтэй', 35], ['Анужин', 'Эмэгтэй', 27], ['Мөнхбат', 'Эрэгтэй', 48]];\n        const statuses = ['pending', 'paid', 'sent'];\n        const list = names.map(([name, gender, age], k) => {\n          const answers = {};\n          QUESTIONS.forEach((q, i) => { answers[i] = Math.max(1, Math.min(5, Math.round(1 + Math.random() * 4))); });\n          const scoresArr = PILLARS.map((p, pi) => {\n            const vals = QUESTIONS.map((q, qi) => ({ q, qi })).filter(x => x.q.p === pi).map(x => answers[x.qi]);\n            return Math.round((vals.reduce((a, b) => a + b, 0) / vals.length - 1) / 4 * 100);\n          });\n          const d = new Date(); d.setDate(d.getDate() - k * 9);\n          return {\n            orderNo: 700100 + k,\n            date: d.toLocaleDateString('sv-SE'),\n            name, age: String(age), gender,\n            phone: `99${Math.floor(100000 + Math.random() * 899999)}`,\n            email: `${name.toLowerCase().replace(/[^a-z]/g, '')}${k}@gmail.com`,\n            scores: scoresArr,\n            answers,\n            overall: this.computeOverall(scoresArr),\n            status: statuses[k % 3],\n          };\n        });\n        const cur = JSON.parse(localStorage.getItem('mls_submissions') || '[]').filter(x => x.orderNo < 700100 || x.orderNo > 700199);\n        localStorage.setItem('mls_submissions', JSON.stringify([...list.reverse(), ...cur]));\n        this.forceUpdate();\n      },\n      exportExcel: () => {\n        const esc = (v) => `\"${String(v ?? '').replace(/\"/g, '\"\"')}\"`;\n        const head = ['Огноо', 'Нэр', 'Нас', 'Хүйс', 'Утас', 'Имэйл', 'Нийт оноо', ...PILLARS.map(p => p.name), ...QUESTIONS.map((q, i) => `${PILLARS[q.p].name} ${i % 3 + 1}: ${q.text}`), 'Захиалга', 'Төлөв'];\n        const rows = subs.map(x => [\n          x.date, x.name, x.age || '', x.gender || '', x.phone, x.email, x.overall,\n          ...PILLARS.map((p, i) => (x.scores && x.scores[i] != null) ? x.scores[i] : ''),\n          ...QUESTIONS.map((q, i) => {\n            const v = x.answers ? x.answers[i] : null;\n            return v ? `${v} — ${q.labels[v - 1]}` : '';\n          }),\n          '#' + x.orderNo, (STATUS[x.status] || STATUS.pending).label,\n        ]);\n        const csv = '\\uFEFF' + [head, ...rows].map(r => r.map(esc).join(',')).join('\\r\\n');\n        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });\n        const a = document.createElement('a');\n        a.href = URL.createObjectURL(blob);\n        a.download = 'mylifescore-burtgel.csv';\n        a.click();\n        URL.revokeObjectURL(a.href);\n      },\n      adminLogout: () => {\n        localStorage.setItem('mls_admin_authed', '0');\n        this.setState({ adminAuthed: false, adminUser: '', adminPass: '' });\n        this.go('landing');\n      },\n      submissions,\n      adminTotal: subs.length,\n      adminPaid: subs.filter(x => x.status === 'paid' || x.status === 'sent').length,\n      adminRevenue: (subs.filter(x => x.status === 'paid' || x.status === 'sent').length * price).toLocaleString('en-US').replace(/,/g, \"'\"),\n      adminAvg: subs.length ? Math.round(subs.reduce((a, x) => a + (x.overall || 0), 0) / subs.length) : 0,\n      ageRows: (() => {\n        const groups = [['18–24', 18, 24], ['25–34', 25, 34], ['35–44', 35, 44], ['45+', 45, 200]];\n        const rows = groups.map(([label, lo, hi]) => ({ label, count: subs.filter(x => { const a = parseInt(x.age); return a >= lo && a <= hi; }).length }));\n        const mx = Math.max(1, ...rows.map(r => r.count));\n        return rows.map(r => ({ ...r, pct: Math.round(r.count / mx * 100) }));\n      })(),\n      genderRows: (() => {\n        const rows = ['Эрэгтэй', 'Эмэгтэй', 'Бусад'].map(label => ({ label, count: subs.filter(x => x.gender === label).length }));\n        const mx = Math.max(1, ...rows.map(r => r.count));\n        return rows.map(r => ({ ...r, pct: Math.round(r.count / mx * 100) }));\n      })(),\n      scoreRows: (() => {\n        const bands = [['0–39', 0, 39], ['40–59', 40, 59], ['60–74', 60, 74], ['75+', 75, 100]];\n        const rows = bands.map(([label, lo, hi]) => ({ label, count: subs.filter(x => (x.overall || 0) >= lo && (x.overall || 0) <= hi).length }));\n        const mx = Math.max(1, ...rows.map(r => r.count));\n        return rows.map(r => ({ ...r, pct: Math.round(r.count / mx * 100) }));\n      })(),\n      hasSubmissions: st.view === 'admin' && st.adminAuthed && submissions.length > 0,\n      noSubmissions: st.view === 'admin' && st.adminAuthed && submissions.length === 0,\n      navHint: navHints[st.view] || '',\n      priceFmt,\n\n      goLanding: () => this.go('landing'),\n      startAssessment: () => this.go('info'),\n\n      infoName: st.name, infoAge: st.age, infoPhone: st.phone,\n      setName: (e) => this.setState({ name: e.target.value }),\n      setAge: (e) => this.setState({ age: e.target.value }),\n      setPhone: (e) => this.setState({ phone: e.target.value }),\n      genderOpts,\n      startQuiz: () => { this.setState({ qIndex: 0, answers: {}, unlocked: false, payState: 'closed', orderNo: Math.floor(100000 + Math.random() * 900000) }); this.go('quiz'); },\n\n      qPillar: PILLARS[q.p].name,\n      qText: q.text, qHook: q.hook,\n      qNum: st.qIndex + 1, qTotal: QUESTIONS.length,\n      progressPct: Math.round(answered / QUESTIONS.length * 100),\n      likert,\n      prevQuestion: () => { if (st.qIndex > 0) this.setState({ qIndex: st.qIndex - 1 }); else this.go('info'); },\n\n      loadingMsg: loadingMsgs[Math.min(st.loadingStep, 3)],\n\n      resultName: (st.name.trim() || 'ТА').toUpperCase(),\n      overall, scoreLabel: labelDef.label, scoreDesc: labelDef.desc,\n      radarPoints: pts,\n      hasPrev,\n      noPrevNote: !hasPrev && st.view === 'result',\n      prevDate: prev ? prev.date : '',\n      overallDelta: prev ? deltaOf(overall - prev.overall) : '',\n      overallDeltaColor: prev ? colorOf(overall - prev.overall) : 'var(--color-neutral-600)',\n      prevRadarPoints,\n      prevRadarOpacity: hasPrev ? 0.9 : 0,\n      compareRows, historyBars,\n      locked: !st.unlocked && (this.props.demoUnlock ?? false) === false,\n      unlockedView: st.unlocked || (this.props.demoUnlock ?? false) === true,\n      strengths, weaknesses,\n      monthlyGoal: GOALS[priority.key],\n      focusName: priority.name,\n      focusScore: priority.score,\n      focusReason: `${priority.name} нь таны хамгийн бага оноотой (${priority.score}) салбар тул энэ сард яг энд төвлөрөхийг санал болгож байна. ${FOCUS_REASONS[priority.key]} Нэг дор бүгдийг биш, нэг салбарыг сонгож сайжруулах нь хамгийн үр дүнтэй арга гэдгийг зан үйлийн судалгаанууд харуулдаг.`,\n      balance: Math.max(...scores) - Math.min(...scores),\n      balanceLabel: (Math.max(...scores) - Math.min(...scores)) <= 15 ? 'Маш тэнцвэртэй' : (Math.max(...scores) - Math.min(...scores)) <= 35 ? 'Харьцангуй тэнцвэртэй' : 'Тэнцвэр алдагдсан',\n      pillarRows: PILLARS.map((p, i) => {\n        const s = scores[i];\n        const band = s >= 75 ? 'high' : s >= 50 ? 'mid' : 'low';\n        return {\n          name: p.name, score: s,\n          band: band === 'high' ? 'Хүчтэй' : band === 'mid' ? 'Дунд' : 'Анхаарах',\n          bandColor: band === 'high' ? 'oklch(0.52 0.14 150)' : band === 'mid' ? 'oklch(0.58 0.14 75)' : 'oklch(0.55 0.21 27)',\n          barColor: band === 'high' ? 'oklch(0.62 0.15 150)' : band === 'mid' ? 'oklch(0.72 0.15 75)' : 'oklch(0.6 0.21 27)',\n          advice: ADVICE[p.key][band],\n        };\n      }),\n      aiSummary,\n      orderNo: st.orderNo,\n\n      payOpen: st.payState !== 'closed',\n      payForm: st.payState === 'form',\n      payChecking: st.payState === 'checking',\n      paySent: st.payState === 'sent',\n      openPay: () => this.setState({ payState: 'form', payError: '' }),\n      closePay: () => this.setState({ payState: 'closed' }),\n      email: st.email,\n      setEmail: (e) => this.setState({ email: e.target.value, payError: '' }),\n      payError: st.payError,\n      payQpay: () => this.setState({ payError: '' }),\n      copyLabel: st.copied ? '✓ Хуулагдлаа' : 'Хуулах',\n      copyAccount: () => {\n        const done = () => { this.setState({ copied: true }); setTimeout(() => this.setState({ copied: false }), 2000); };\n        if (navigator.clipboard && navigator.clipboard.writeText) {\n          navigator.clipboard.writeText('MN770032005001589646').then(done, done);\n        } else { done(); }\n      },\n      confirmPay: () => {\n        const ok = /^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(st.email.trim());\n        if (!ok) { this.setState({ payError: 'Тайлан хүлээн авах зөв имэйл хаягаа оруулна уу.' }); return; }\n        this.setState({ payState: 'checking' });\n        setTimeout(() => {\n          try {\n            const list = JSON.parse(localStorage.getItem('mls_submissions') || '[]');\n            const scores = this.pillarScores();\n            const existing = list.find(x => x.orderNo === this.state.orderNo);\n            const record = {\n              orderNo: this.state.orderNo,\n              date: new Date().toLocaleDateString('sv-SE'),\n              name: this.state.name.trim() || '—',\n              phone: this.state.phone.trim() || '—',\n              age: this.state.age,\n              gender: ['Эрэгтэй', 'Эмэгтэй', 'Бусад'][this.state.gender] || '—',\n              scores,\n              answers: { ...this.state.answers },\n              email: this.state.email.trim(),\n              overall: this.computeOverall(scores),\n              status: existing ? existing.status : 'pending',\n            };\n            const updated = list.filter(x => x.orderNo !== this.state.orderNo);\n            updated.push(record);\n            localStorage.setItem('mls_submissions', JSON.stringify(updated));\n          } catch (e) {}\n          this.setState({ payState: 'sent' });\n        }, 1900);\n      },\n      viewReport: () => { this.setState({ payState: 'closed', unlocked: true }); window.scrollTo(0, 0); },\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
