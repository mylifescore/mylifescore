document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

;\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #f3f2f2;\n  --color-surface: #eae9e9;\n  --color-text: #201e1d;\n  --color-accent: #ec3013;\n  --color-accent-2: #e15b47;\n  --color-divider: color-mix(in srgb, #201e1d 40%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f8f4f4;\n  --color-neutral-200: #eae7e7;\n  --color-neutral-300: #d7d3d3;\n  --color-neutral-400: #bab6b6;\n  --color-neutral-500: #9b9797;\n  --color-neutral-600: #7d7979;\n  --color-neutral-700: #605d5d;\n  --color-neutral-800: #444141;\n  --color-neutral-900: #2d2b2b;\n\n  --color-accent-100: #fff2ef;\n  --color-accent-200: #ffe0d9;\n  --color-accent-300: #ffc4b8;\n  --color-accent-400: #ff9783;\n  --color-accent-500: #ff563c;\n  --color-accent-600: #dd2b0f;\n  --color-accent-700: #ae1800;\n  --color-accent-800: #7c1405;\n  --color-accent-900: #4d170e;\n\n  --color-accent-2-100: #fff2ef;\n  --color-accent-2-200: #ffe0da;\n  --color-accent-2-300: #ffc4b9;\n  --color-accent-2-400: #ff9784;\n  --color-accent-2-500: #ef6853;\n  --color-accent-2-600: #c94b39;\n  --color-accent-2-700: #9e3526;\n  --color-accent-2-800: #71261b;\n  --color-accent-2-900: #471d16;\n\n  --font-heading: \"Archivo\", system-ui, sans-serif;\n  --font-heading-weight: 800;\n  --font-body: \"Archivo\", system-ui, sans-serif;\n\n  --space-1: 4.0px;\n  --space-2: 8.0px;\n  --space-3: 12.0px;\n  --space-4: 16.0px;\n  --space-6: 24.0px;\n  --space-8: 32.0px;\n\n  --radius-sm: 0px;\n  --radius-md: 0px;\n  --radius-lg: 0px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2d2b2b 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2d2b2b 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.grayscale{filter:grayscale(1) contrast(1.08)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 2px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 13px; line-height: 1.2; color: var(--color-text);\n  background: transparent; border: 1px solid transparent;\n  padding: calc(var(--space-2) * 0.85) var(--space-3);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 34px; height: 34px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); justify-content: flex-start; text-align: left; }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: 2px solid var(--color-divider);\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 2px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid var(--color-divider);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  ba    @media (max-width: 760px) {\n      .ms-g2, .ms-g3 { grid-template-columns: 1fr !important; }\n      .ms-g4 { grid-template-columns: 1fr 1fr !important; }\n      .ms-scale-wide { display: none !important; }\n      .ms-scale-narrow { display: flex !important; }\n    }\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n\n\n<div style=\"min-height: 100vh; background: var(--color-bg); color: var(--color-text); font-family: var(--font-body); display: flex; flex-direction: column;\">\n\n  <!-- NAV -->\n  <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px 32px; border-bottom: 2px solid var(--color-divider);\">\n    <div sc-camel-on-click=\"{{ goLanding }}\" style=\"font-family: var(--font-heading); font-weight: 800; font-size: 18px; letter-spacing: .06em; cursor: pointer;\">MYLIFE <span style=\"color: var(--color-accent);\">SCORE<\u002Fspan><\u002Fdiv>\n    <div style=\"display: flex; align-items: center; gap: 16px;\">\n      <div style=\"font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--color-neutral-600);\">{{ navHint }}<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ===================== ADMIN LOGIN ===================== -->\n  <sc-if value=\"{{ isAdminLogin }}\" hint-placeholder-val=\"{{ false }}\">\n    <div data-screen-label=\"Admin login\" style=\"max-width: 420px; margin: 0 auto; padding: 72px 32px; width: 100%; box-sizing: border-box;\">\n      <div style=\"font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--color-accent-700);\">Админ<\u002Fdiv>\n      <h2 style=\"font-family: var(--font-heading); font-weight: 800; font-size: 30px; margin: 12px 0 24px;\">Нэвтрэх<\u002Fh2>\n      <div style=\"display: flex; flex-direction: column; gap: 18px;\">\n        <div class=\"field\"><label>Хэрэглэгчийн нэр<\u002Flabel><input class=\"input\" value=\"{{ adminUser }}\" sc-camel-on-change=\"{{ setAdminUser }}\" placeholder=\"admin\"><\u002Fdiv>\n        <div class=\"field\"><label>Нууц үг<\u002Flabel><input class=\"input\" value=\"{{ adminPass }}\" sc-camel-on-change=\"{{ setAdminPass }}\" type=\"password\" placeholder=\"••••••••\"><\u002Fdiv>\n        <sc-if value=\"{{ adminError }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"font-size: 13px; color: var(--color-accent-700);\">{{ adminError }}<\u002Fdiv>\n        <\u002Fsc-if>\n        <button class=\"btn btn-primary btn-block\" sc-camel-on-click=\"{{ adminLogin }}\" style=\"font-size: 15px; padding: 12px 18px;\">Нэвтрэх →<\u002Fbutton>\n        <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ goLanding }}\">← Буцах<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ===================== ADMIN ===================== -->\n  <sc-if value=\"{{ isAdmin }}\" hint-placeholder-val=\"{{ false }}\">\n    <div data-screen-label=\"Admin\" style=\"max-width: 1200px; margin: 0 auto; padding: 48px 32px; width: 100%; box-sizing: border-box;\">\n      <div style=\"display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap;\">\n        <div>\n          <div style=\"font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--color-accent-700);\">Админ<\u002Fdiv>\n          <h2 style=\"font-family: var(--font-heading); font-weight: 800; font-size: 34px; margin: 12px 0 8px;\">Хэрэглэгчдийн бүртгэл<\u002Fh2>\n        <\u002Fdiv>\n        <div style=\"display: flex; gap: 8px;\">\n          <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ goLanding }}\">← Нүүр хуудас<\u002Fbutton>\n          <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ seedDemo }}\">Туршилтын өгөгдөл<\u002Fbutton>\n          <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ exportExcel }}\">⬇ Excel татах<\u002Fbutton>\n          <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ adminLogout }}\">Гарах<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"card\" style=\"padding: 20px 24px; margin: 16px 0 28px; border-left: 4px solid var(--color-accent);\">\n        <div style=\"font-weight: 700; margin-bottom: 6px;\">Төлбөрийг хэрхэн шалгах вэ?<\u002Fdiv>\n        <div style=\"font-size: 14px; color: var(--color-neutral-700); line-height: 1.65;\">Хэрэглэгч QR-аар төлөхдөө <b>гүйлгээний утга дээр имэйл хаягаа<\u002Fb> бичдэг. Банкны хуулгаа шалгаад доорх жагсаалтаас тухайн имэйлтэй мөрийг олж <b>«Төлсөн»<\u002Fb> гэж тэмдэглэнэ. Дараа нь тайланг имэйл рүү нь илгээгээд <b>«Илгээсэн»<\u002Fb> болгоно.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ hasSubmissions }}\" hint-placeholder-val=\"{{ false }}\">\n        <!-- ADMIN STATS -->\n        <div class=\"ms-g4\" style=\"display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px;\">\n          <div class=\"card\" style=\"padding: 20px;\"><div class=\"card-kicker\">Нийт хэрэглэгч<\u002Fdiv><div style=\"font-family: var(--font-heading); font-weight: 800; font-size: 40px; margin-top: 8px;\">{{ adminTotal }}<\u002Fdiv><\u002Fdiv>\n          <div class=\"card\" style=\"padding: 20px;\"><div class=\"card-kicker\">Төлбөр төлсөн<\u002Fdiv><div style=\"font-family: var(--font-heading); font-weight: 800; font-size: 40px; margin-top: 8px; color: var(--color-accent-700);\">{{ adminPaid }}<\u002Fdiv><\u002Fdiv>\n          <div class=\"card\" style=\"padding: 20px;\"><div class=\"card-kicker\">Орлого<\u002Fdiv><div style=\"font-family: var(--font-heading); font-weight: 800; font-size: 40px; margin-top: 8px;\">{{ adminRevenue }}₮<\u002Fdiv><\u002Fdiv>\n          <div class=\"card\" style=\"padding: 20px;\"><div class=\"card-kicker\">Дундаж оноо<\u002Fdiv><div style=\"font-family: var(--font-heading); font-weight: 800; font-size: 40px; margin-top: 8px;\">{{ adminAvg }}<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"ms-g3\" style=\"display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin-bottom: 32px;\">\n          <div class=\"card\" style=\"padding: 20px;\">\n            <div class=\"card-kicker\" style=\"margin-bottom: 14px;\">Насны бүлэг<\u002Fdiv>\n            <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n              <sc-for list=\"{{ ageRows }}\" as=\"a\" hint-placeholder-count=\"4\">\n                <div style=\"display: grid; grid-template-columns: 64px 1fr 28px; align-items: center; gap: 10px; font-size: 13px;\">\n                  <div>{{ a.label }}<\u002Fdiv>\n                  <div style=\"height: 12px; background: var(--color-neutral-200);\"><div style=\"height: 12px; background: var(--color-accent); width: {{ a.pct }}%;\"><\u002Fdiv><\u002Fdiv>\n                  <b>{{ a.count }}<\u002Fb>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"card\" style=\"padding: 20px;\">\n            <div class=\"card-kicker\" style=\"margin-bottom: 14px;\">Хүйс<\u002Fdiv>\n            <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n              <sc-for list=\"{{ genderRows }}\" as=\"g\" hint-placeholder-count=\"3\">\n                <div style=\"display: grid; grid-template-columns: 76px 1fr 28px; align-items: center; gap: 10px; font-size: 13px;\">\n                  <div>{{ g.label }}<\u002Fdiv>\n                  <div style=\"height: 12px; background: var(--color-neutral-200);\"><div style=\"height: 12px; background: var(--color-accent-400); width: {{ g.pct }}%;\"><\u002Fdiv><\u002Fdiv>\n                  <b>{{ g.count }}<\u002Fb>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"card\" style=\"padding: 20px;\">\n            <div class=\"card-kicker\" style=\"margin-bottom: 14px;\">Онооны тархалт<\u002Fdiv>\n            <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n              <sc-for list=\"{{ scoreRows }}\" as=\"sc\" hint-placeholder-count=\"4\">\n                <div style=\"di nd; gap: 6px; height: 48px;\">\n                <div style=\"width: 18px; height: 26px; background: var(--color-neutral-300);\"><\u002Fdiv>\n                <div style=\"width: 18px; height: 30px; background: var(--color-neutral-300);\"><\u002Fdiv>\n                <div style=\"width: 18px; height: 28px; background: var(--color-neutral-300);\"><\u002Fdiv>\n                <div style=\"width: 18px; height: 36px; background: var(--color-accent-300);\"><\u002Fdiv>\n                <div style=\"width: 18px; height: 42px; background: var(--color-accent-400);\"><\u002Fdiv>\n                <div style=\"width: 18px; height: 48px; background: var(--color-accent);\"><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"text-align: right;\">\n              <div style=\"font-family: var(--font-heading); font-weight: 800; font-size: 24px; color: var(--color-accent-700);\">+9<\u002Fdiv>\n              <div style=\"font-size: 12px; color: var(--color-neutral-600);\">оноо / сүүлийн 3 сар<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- HOW IT WORKS -->\n      <div style=\"max-width: 1200px; margin: 0 auto; padding: 56px 32px; border-bottom: 2px solid var(--color-divider); box-sizing: border-box;\">\n        <div style=\"font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--color-accent-700); margin-bottom: 24px;\">Хэрхэн ажилладаг вэ<\u002Fdiv>\n        <div class=\"ms-g4\" style=\"display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; border-top: 2px solid var(--color-text);\">\n          <div style=\"padding: 20px 20px 20px 0; border-right: 1px solid var(--color-divider);\">\n            <div style=\"font-family: var(--font-heading); font-weight: 800; font-size: 28px; color: var(--color-accent);\">01<\u002Fdiv>\n            <div style=\"font-weight: 700; margin: 8px 0 6px;\">Асуултад хариулна<\u002Fdiv>\n            <div style=\"font-size: 14px; color: var(--color-neutral-600); line-height: 1.5;\">8 салбарын 24 асуулт. 5 минут л хангалттай.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding: 20px; border-right: 1px solid var(--color-divider);\">\n            <div style=\"font-family: var(--font-heading); font-weight: 800; font-size: 28px; color: var(--color-accent);\">02<\u002Fdiv>\n            <div style=\"font-weight: 700; margin: 8px 0 6px;\">Оноогоо харна<\u002Fdiv>\n            <div style=\"font-size: 14px; color: var(--color-neutral-600); line-height: 1.5;\">Нийт Life Score болон radar зураглал — үнэгүй.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding: 20px; border-right: 1px solid var(--color-divider);\">\n            <div style=\"font-family: var(--font-heading); font-weight: 800; font-size: 28px; color: var(--color-accent);\">03<\u002Fdiv>\n            <div style=\"font-weight: 700; margin: 8px 0 6px;\">Төлбөрөө төлнө<\u002Fdiv>\n            <div style=\"font-size: 14px; color: var(--color-neutral-600); line-height: 1.5;\">9,900₮ — QPay эсвэл QR кодоор шууд.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding: 20px;\">\n            <div style=\"font-family: var(--font-heading); font-weight: 800; font-size: 28px; color: var(--color-accent);\">04<\u002Fdiv>\n            <div style=\"font-weight: 700; margin: 8px 0 6px;\">Зөвлөгөө, үр дүнгээ авна<\u002Fdiv>\n            <div style=\"font-size: 14px; color: var(--color-neutral-600); line-height: 1.5;\">AI бүрэн тайлан таны имэйл рүү илгээгдэнэ.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- 8 PILLARS -->\n      <div style=\"max-width: 1200px; margin: 0 auto; padding: 56px 32px; border-bottom: 2px solid var(--color-divider); box-sizing: border-box;\">\n        <div style=\"font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--color-accent-700); margin-bottom: 12px;\">Юуг хэмждэг вэ<\u002Fdiv>\n        <h2 style=\"font-family: var(--font-heading); font-weight: 800; font-size: 36px; margin: 0 0 16px;\">Бид амьдралыг тань 8 өнцгөөс харна.<\u002Fh2>\n        <p style=\"font-size: 16px; line-height: 1.6; color: var(--color-neutral-700); max-width: 640px; margin: 0 0 28px;\">Сайхан амьдрал гэдэг зөвхөн мөнгө ч биш, зөвхөн эрүүл мэнд ч биш. Аль нэг нь доголдоход бусад нь дагаад ганхдаг. Тийм учраас бид 8 салбарыг тус тусад нь хэмжиж, нэг оноонд нэгтгэдэг.<\u002Fp>\n        <div class=\"ms-g4\" style=\"display: grid; grid-template-columns: repeat(4, 1fr); border-top: 2px solid var(--color-text); border-left: 1px solid var(--color-divider);\">\n          <div style=\"padding: 20px; border-right: 1px solid var(--color-divider); border-bottom: 1px solid var(--color-divider);\"><div style=\"font-family: var(--font-heading); font-weight: 800; font-size: 14px; color: var(--color-accent);\">01<\u002Fdiv><div style=\"font-weight: 700; margin: 6px 0 4px;\">Эрүүл мэнд<\u002Fdiv><div style=\"font-size: 13px; color: var(--color-neutral-600); line-height: 1.5;\">Бие ядарсан үед ямар ч төлөвлөгөө урагшилдаггүй. Тиймээс бид эндээс л эхэлж хэмждэг.<\u002Fdiv><\u002Fdiv>\n          <div style=\"padding: 20px; border-right: 1px solid var(--color-divider); border-bottom: 1px solid var(--color-divider);\"><div style=\"font-family: var(--font-heading); font-weight: 800; font-size: 14px; color: var(--color-accent);\">02<\u002Fdiv><div style=\"font-weight: 700; margin: 6px 0 4px;\">Сэтгэл зүй<\u002Fdiv><div style=\"font-size: 13px; color: var(--color-neutral-600); line-height: 1.5;\">Дотроо шаналж яваа хүнд амжилт ч баяр өгдөггүй. Сэтгэлээ мэдэх нь өөрийгөө ойлгох эхлэл.<\u002Fdiv><\u002Fdiv>\n          <div style=\"padding: 20px; border-right: 1px solid var(--color-divider); border-bottom: 1px solid var(--color-divider);\"><div style=\"font-family: var(--font-heading); font-weight: 800; font-size: 14px; color: var(--color-accent);\">03<\u002Fdiv><div style=\"font-weight: 700; margin: 6px 0 4px;\">Санхүү<\u002Fdiv><div style=\"font-size: 13px; color: var(--color-neutral-600); line-height: 1.5;\">Мөнгө аз жаргал биш ч, мөнгөний стресс нойр, харилцааг чинь идэж эхэлдэг.<\u002Fdiv><\u002Fdiv>\n          <div style=\"padding: 20px; border-right: 1px solid var(--color-divider); border-bottom: 1px solid var(--color-divider);\"><div style=\"font-family: var(--font-heading); font-weight: 800; font-size: 14px; color: var(--color-accent);\">04<\u002Fdiv><div style=\"font-weight: 700; margin: 6px 0 4px;\">Карьер<\u002Fdiv><div style=\"font-size: 13px; color: var(--color-neutral-600); line-height: 1.5;\">Өдрийн ихэнх цагаа өнгөрөөдөг газраа өсөж байна уу, зүгээр л тэвчиж байна уу — ялгаа нь асар том.<\u002Fdiv><\u002Fdiv>\n          <div style=\"padding: 20px; border-right: 1px solid var(--color-divider); border-bottom: 1px solid var(--color-divider);\"><div style=\"font-family: var(--font-heading); font-weight: 800; font-size: 14px; color: var(--color-accent);\">05<\u002Fdiv><div style=\"font-weight: 700; margin: 6px 0 4px;\">Харилцаа<\u002Fdiv><div style=\"font-size: 13px; color: var(--color-neutral-600); line-height: 1.5;\">Хамгийн хэцүү өдөр тань хэн хажууд тань байх вэ? Энэ асуултын хариу амьдралын чанарыг тодорхойлдог.<\u002Fdiv><\u002Fdiv>\n          <div style=\"padding: 20px; border-right: 1px solid var(--color-divider); border-bottom: 1px solid var(--color-divider);\"><div style=\"font-family: var(--font-heading); font-weight: 800; font-size: 14px; color: var(--color-accent);\">06<\u002Fdiv><div style=\"font-weight: 700; margin: 6px 0 4px;\">Нийгэм<\u002Fdiv><div style=\"font-size: 13px; color: var(--color-neutral-600); line-height: 1.5;\">Найзуудтайгаа уулзахаа больсноо хүн ихэвчлэн анзаардаггүй. Тоо нь харин шууд хэлж өгдөг.<\u002Fdiv><\u002Fdiv>\n          <div style=\"padding: 20px; border-right: 1px solid var(--color-divider); border-bottom: 1px solid var(--color-divider);\"><div style=\"font-family: var(--font-heading); font-weight: 800; font-size: 14px; color: var(--color-accent);\">07<\u002Fdiv><div style=\"font-weight: 700; margin: 6px 0 4px;\">Хөгжил<\u002Fdiv><div style=\"font-size: 13px; color: var(--color-neutral-600); line-height: 1.5;\">Сүүлд хэзээ шинэ зүйл сурснаа санахгүй байвал энэ салбар тань анхаарал хүсч байна гэсэн үг.<\u002Fdiv><\u002Fdiv>\n          <div style=\"padding: 20px; border-right: 1px solid var(--color-divider); border-bottom: 1px solid var(--color-divider);\"><div style=\"font-family: var(--font-heading); font-weight: 800; font-size: 14px; color: var(--color-accent);\">08<\u002Fdiv><div style=\"font-weight: 700; margin: 6px 0 4px;\">Зорилго<\u002Fdiv><div style=\"font-size: 13px; color: var(--color-neutral-600); line-height: 1.5;\">Юуны төлөө босдогоо мэддэг хүн хэцүүг давахдаа хурдан. Хэмжихэд хамгийн хэцүү ч хамгийн чухал нь.<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- SCORE SCALE -->\n        <div style=\"margin-top: 40px;\">\n          <div style=\"font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--color-accent-700); margin-bottom: 16px;\">Оноо тань юу хэлэх вэ<\u002Fdiv>\n          <div class=\"ms-scale-wide\">\n            <div style=\"height: 32px; background: linear-gradient(90deg, oklch(0.58 0.22 27) 0%, oklch(0.68 0.19 45) 30%, oklch(0.75 0.16 75) 50%, oklch(0.8 0.17 105) 65%, oklch(0.72 0.18 135) 80%, oklch(0.58 0.16 152) 100%);\"><\u002Fdiv>\n            <div style=\"display: flex; font-size: 12px; color: var(--color-neutral-700); margin-top: 8px;\">\n              <div style=\"width: 40%;\"><b>0–39<\u002Fb><br>Анхаарал шаардлагатай<\u002Fdiv>\n              <div style=\"width: 20%;\"><b>40–59<\u002Fb><br>Хөгжиж буй<\u002Fdiv>\n              <div style=\"width: 15%;\"><b>60–74<\u002Fb><br>Тогтвортой<\u002Fdiv>\n              <div style=\"width: 13%;\"><b>75–87<\u002Fb><br>Сайн<\u002Fdiv>\n              <div style=\"width: 12%;\"><b>88–100<\u002Fb><br>Маш сайн<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"ms-scale-narrow\" style=\"display: none; flex-direction: column; gap: 8px;\">\n            <div style=\"display: grid; grid-template-columns: 16px 70px 1fr; align-items: center; gap: 10px; font-size: 13px;\"><div style=\"height: 16px; background: oklch(0.58 0.22 27);\"><\u002Fdiv><b>0–39<\u002Fb><span style=\"color: var(--color-neutral-700);\">Анхаарал шаардлагатай<\u002Fspan><\u002Fdiv>\n            <div style=\"display: grid; grid-template-columns: 16px 70px 1fr; align-items: center; gap: 10px; font-size: 13px;\"><div style=\"height: 16px; background: oklch(0.7 0.18 55);\"><\u002Fdiv><b>40–59<\u002Fb><span style=\"color: var(--color-neutral-700);\">Хөгжиж буй<\u002Fspan><\u002Fdiv>\n            <div style=\"display: grid; grid-template-columns: 16px 70px 1fr; align-items: center; gap: 10px; font-size: 13px;\"><div style=\"height: 16px; background: oklch(0.8 0.17 105);\"><\u002Fdiv><b>60–74<\u002Fb><span style=\"color: var(--color-neutral-700);\">Тогтвортой<\u002Fspan><\u002Fdiv>\n            <div style=\"display: grid; grid-template-columns: 16px 70px 1fr; align-items: center; gap: 10px; font-size: 13px;\"><div style=\"height: 16px; background: oklch(0.72 0.18 135);\"><\u002Fdiv><b>75–87<\u002Fb><span style=\"color: var(--color-neutral-700);\">Сайн<\u002Fspan><\u002Fdiv>\n            <div style=\"display: grid; grid-template-columns: 16px 70px 1fr; align-items: center; gap: 10px; font-size: 13px;\"><div style=\"height: 16px; background: oklch(0.58 0.16 152);\"><\u002Fdiv><b>88–100<\u002Fb><span style=\"color: var(--color-neutral-700);\">Маш сайн<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- SCIENCE -->\n      <div style=\"background: var(--color-accent-100);\">\n        <div style=\"max-width: 1200px; margin: 0 auto; padding: 64px 32px; box-sizing: border-box;\">\n          <div style=\"font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--color-accent-700); margin-bottom: 16px;\">The Science Behind MyLife Score<\u002Fdiv>\n          <div class=\"ms-g2\" style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 48px; align-items: start;\">\n            <div style=\"display: flex; flex-direction: column; gap: 16px;\">\n              <h2 style=\"font-family: var(--font-heading); font-weight: 800; font-size: 38px; line-height: 1.1; margin: 0;\">Таамаг биш, <span style=\"color: var(--color-accent-700);\">шинжлэх ухаанд<\u002Fspan> суурилсан.<\u002Fh2>\n              <p style=\"font-size: 16px; line-height: 1.65; margin: 0; color: var(--color-neutral-700);\">MyLife Score нь олон улсад хүлээн зөвшөөрөгдсөн судалгаа, framework-үүдээс санаа авч боловсруулсан үнэлгээний систем юм. Эдгээр ойлголтыг нэгтгэсэн <b style=\"color: var(--color-accent-700);\">MyLife Score Intelligence Engine<\u002Fb> нь таны өөрийгөө үнэлсэн мэдээллийг ашиглан хувь хүний хөгжлийн чиглэл, эрсдэл, боломжийг тодорхойлдог.<\u002Fp>\n              <p style=\"font-size: 14px; line-height: 1.6; margin: 0; opacity: .6;\">Асуулт бүр аль нэг framework-ийн хэмжигддэг үзүүлэлтэд суурилсан бөгөөд 8 салбарын жинлэсэн алгоритмаар нэгтгэгдэнэ.<\u002Fp>\n              <div style=\"display: flex; gap: 32px; margin-top: 8px;\">\n                <div><div style=\"font-family: var(--font-heading); font-weight: 800; font-size: 32px; color: var(--color-accent-700);\">6<\u002Fdiv><div style=\"font-size: 12px; opacity: .6; letter-spacing: .08em; text-transform: uppercase;\">Framework<\u002Fdiv><\u002Fdiv>\n                <div><div style=\"font-family: var(--font-heading); font-weight: 800; font-size: 32px; color: var(--color-accent-700);\">8<\u002Fdiv><div style=\"font-size: 12px; opacity: .6; letter-spacing: .08em; text-transform: uppercase;\">Салбар<\u002Fdiv><\u002Fdiv>\n                <div><div style=\"font-family: var(--font-heading); font-weight: 800; font-size: 32px; color: var(--color-accent-700);\">24<\u002Fdiv><div style=\"font-size: 12px; opacity: .6; letter-spacing: .08em; text-transform: uppercase;\">Үзүүлэлт<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 0; border-top: 2px solid var(--color-text);\">\n              <div style=\"padding: 16px 16px 16px 0; border-bottom: 1px solid var(--color-accent-200); border-right: 1px solid var(--color-accent-200);\">\n                <div style=\"font-weight: 700; font-size: 15px; color: var(--color-accent-700);\">Wheel of Life<\u002Fdiv>\n                <div style=\"font-size: 13px; opacity: .65; line-height: 1.5; margin-top: 4px;\">Коучингийн сонгодог framework — амьдралын салбаруудын тэнцвэрийг хэмжих загвар.<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"padding: 16px; border-bottom: 1px solid var(--color-accent-200);\">\n                <div style=\"font-weight: 700; font-size: 15px; color: var(--color-accent-700);\">PERMA — Positive Psychology<\u002Fdiv>\n                <div style=\"font-size: 13px; opacity: .65; line-height: 1.5; margin-top: 4px;\">Мартин Селигманы аз жаргалын 5 суурь элементийн онол.<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"padding: 16px 16px 16px 0; border-bottom: 1px solid var(--color-accent-200); border-right: 1px solid var(--color-accent-200);\">\n                <div style=\"font-weight: 700; font-size: 15px; color: var(--color-accent-700);\">WHO Well-being Model<\u002Fdiv>\n                <div style=\"font-size: 13px; opacity: .65; line-height: 1.5; margin-top: 4px;\">ДЭМБ-ын сайн сайхан байдлын цогц загвар — бие, сэтгэц, нийгмийн эрүүл мэнд.<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"padding: 16px; border-bottom: 1px solid var(--color-accent-200);\">\n                <div style=\"font-weight: 700; font-size: 15px; color: var(--color-accent-700);\">Satisfaction With Life Scale<\u002Fdiv>\n                <div style=\"font-size: 13px; opacity: .65; line-height: 1.5; margin-top: 4px;\">Динерийн амьдралын сэтгэл ханамжийг хэмжих баталгаажсан хэмжүүр.<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"padding: 16px 16px 16px 0; border-right: 1px solid var(--color-accent-200);\">\n                <div style=\"font-weight: 700; font-size: 15px; color: var(--color-accent-700);\">Financial Wellness<\u002Fdiv>\n                <div style=\"font-size: 13px; opacity: .65; line-height: 1.5; margin-top: 4px;\">Санхүүгийн аюулгүй байдал, хяналт, хуримтлалын зарчмууд.<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"padding: 16px;\">\n                <div style=\"font-weight: 700; font-size: 15px; color: var(--color-accent-700);\">Self-Determination Theory<\u002Fdiv>\n                <div style=\"font-size: 13px; opacity: .65; line-height: 1.5; margin-top: 4px;\">Дотоод сэдэл, бие даасан байдал, өсөлтийн сэтгэл зүйн онол.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- PRICING -->\n      <div style=\"max-width: 1200px; margin: 0 auto; padding: 56px 32px; box-sizing: border-box;\">\n        <div style=\"font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--color-accent-700); margin-bottom: 24px;\">Үнэ<\u002Fdiv>\n        <div class=\"ms-g2\" style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 24px;\">\n          <div class=\"card\" style=\"padding: 28px; display: flex; flex-direction: column; gap: 12px; align-items: flex-start;\">\n            <div class=\"tag tag-neutral\">ҮНЭГҮЙ<\u002Fdiv>\n            <div style=\"font-family: var(--font-heading); font-weight: 800; font-size: 36px;\">0₮<\u002Fdiv>\n            <div style=\"font-size: 15px; line-height: 1.7; color: var(--color-neutral-700);\">Нийт Life Score<br>Radar зураглал<br>Түвшний тодорхойлолт<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"card elev-md\" style=\"padding: 28px; display: flex; flex-direction: column; gap: 12px; align-items: flex-start; border: 2px solid var(--color-accent);\">\n            <div class=\"tag tag-accent\">БҮРЭН ТАЙЛАН<\u002Fdiv>\n            <div style=\"font-family: var(--font-heading); font-weight: 800; font-size: 36px;\">{{ priceFmt }}₮<\u002Fdiv>\n            <div style=\"font-size: 15px; line-height: 1.7; color: var(--color-neutral-700);\">Салбар бүрийн задаргаа<br>Давуу / сул тал TOP-3<br>AI зөвлөгөө + 30 хоногийн төлөвлөгөө<br>Тайлан имэйлээр (PDF)<\u002Fdiv>\n            <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ startAssessment }}\">Эхлэх →<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- POSTER CLOSE -->\n      <div style=\"background: var(--color-accent); color: #fff; padding: 64px 32px;\">\n        <div style=\"max-width: 1200px; margin: 0 auto;\">\n          <div style=\"font-family: var(--font-heading); font-weight: 800; font-size: clamp(30px, 6vw, 44px); line-height: 1.1; max-width: 700px;\">Таны амьдралын кредит оноо.<\u002Fdiv>\n          <button class=\"btn\" sc-camel-on-click=\"{{ startAssessment }}\" style=\"margin-top: 28px; background: #fff; color: var(--color-accent); border: none; font-size: 16px; padding: 14px 28px; cursor: pointer;\">Үнэгүй эхлэх →<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"padding: 20px 32px; font-size: 12px; color: var(--color-neutral-500); display: flex; justify-content: space-between; align-items: center;\">\n        <div>© 2026 MyLife Score<\u002Fdiv>\n        <div style=\"display: flex; gap: 20px; align-items: center;\">\n          <div>hello@mylifescore.mn<\u002Fdiv>\n          <button sc-camel-on-click=\"{{ goAdmin }}\" style=\"background: none; border: none; cursor: pointer; font-family: var(--font-body); font-size: 12px; color: var(--color-neutral-400); padding: 0;\">Админ<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ===================== INFO ===================== -->\n  <sc-if value=\"{{ isInfo }}\" hint-placeholder-val=\"{{ false }}\">\n    <div data-screen-label=\"User info\" style=\"max-width: 560px; margin: 0 auto; padding: 56px 32px; width: 100%; box-sizing: border-box;\">\n      <div style=\"font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--color-accent-700);\">Алхам 1 / 2<\u002Fdiv>\n      <h2 style=\"font-family: var(--font-heading); font-weight: 800; font-size: 34px; margin: 12px 0 8px;\">Таны мэдээлэл<\u002Fh2>\n      <p style=\"color: var(--color-neutral-600); margin: 0 0 32px; font-size: 15px;\">Үнэлгээг таны нас, амьдралын нөхцөлд тааруулахад ашиглана.<\u002Fp>\n      <div style=\"display: flex; flex-direction: column; gap: 20px;\">\n        <div class=\"field\"><label>Нэр<\u002Flabel><input class=\"input\" value=\"{{ infoName }}\" sc-camel-on-change=\"{{ setName }}\" placeholder=\"Таны нэр\"><\u002Fdiv>\n        <div class=\"ms-g2\" style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 16px;\">\n          <div class=\"field\"><label>Нас<\u002Flabel><input class=\"input\" value=\"{{ infoAge }}\" sc-camel-on-change=\"{{ setAge }}\" placeholder=\"27\" type=\"number\"><\u002Fdiv>\n          <div class=\"field\"><label>Утасны дугаар<\u002Flabel><input class=\"input\" value=\"{{ infoPhone }}\" sc-camel-on-change=\"{{ setPhone }}\" placeholder=\"9911 2233\" type=\"tel\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"field\">\n          <label>Хүйс<\u002Flabel>\n          <div class=\"seg\">\n            <sc-for list=\"{{ genderOpts }}\" as=\"g\" hint-placeholder-count=\"3\">\n              <button class=\"seg-opt\" sc-camel-on-click=\"{{ g.pick }}\" style=\"{{ g.style }}\">{{ g.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <button class=\"btn btn-primary btn-block\" sc-camel-on-click=\"{{ startQuiz }}\" style=\"margin-top: 8px; font-size: 16px; padding: 14px 20px;\">Асуулга эхлэх →<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ===================== QUIZ ===================== -->\n  <sc-if value=\"{{ isQuiz }}\" hint-placeholder-val=\"{{ false }}\">\n    <div data-screen-label=\"Assessment\" style=\"max-width: 680px; margin: 0 auto; padding: 48px 32px; width: 100%; box-sizing: border-box;\">\n      <div style=\"display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px;\">\n        <div style=\"font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--color-accent-700);\">{{ qPillar }}<\u002Fdiv>\n        <div style=\"font-size: 13px; color: var(--color-neutral-600);\">{{ qNum }} / {{ qTotal }}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"height: 4px; background: var(--color-neutral-200); margin-bottom: 40px;\">\n        <div style=\"height: 4px; background: var(--color-accent); width: {{ progressPct }}%; transition: width .3s;\"><\u002Fdiv>\n      <\u002Fdiv>\n      <h2 style=\"font-family: var(--font-heading); font-weight: 800; font-size: 32px; line-height: 1.2; margin: 0 0 12px;\">{{ qText }}<\u002Fh2>\n      <p style=\"font-size: 14px; color: var(--color-neutral-600); line-height: 1.55; margin: 0 0 32px; border-left: 2px solid var(--color-accent); padding-left: 12px;\">{{ qHook }}<\u002Fp>\n      <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n        <sc-for list=\"{{ likert }}\" as=\"opt\" hint-placeholder-count=\"5\">\n          <button sc-camel-on-click=\"{{ opt.pick }}\" style=\"{{ opt.style }}\" style-hover=\"border-color: var(--color-accent); background: var(--color-accent-100);\">\n            <span style=\"font-family: var(--font-heading); font-weight: 800; width: 24px; display: inline-block;\">{{ opt.n }}<\u002Fspan>\n            <span>{{ opt.label }}<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"margin-top: 28px;\">\n        <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ prevQuestion }}\">← Буцах<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ===================== LOADING ===================== -->\n  <sc-if value=\"{{ isLoading }}\" hint-placeholder-val=\"{{ false }}\">\n    <div data-screen-label=\"Loading\" style=\"flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 80px 32px; gap: 28px;\">\n      <div style=\"width: 280px; height: 4px; background: var(--color-neutral-200); overflow: hidden;\">\n        <div style=\"height: 4px; background: var(--color-accent); transform-origin: left; animation: msPulse 4.4s linear forwards;\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-family: var(--font-heading); font-weight: 700; font-size: 22px; animation: msBlink 1.1s infinite;\">{{ loadingMsg }}<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ===================== RESULT ===================== -->\n  <sc-if value=\"{{ isResult }}\" hint-placeholder-val=\"{{ false }}\">\n    <div data-screen-label=\"Result\" style=\"max-width: 1000px; margin: 0 auto; padding: 48px 32px; width: 100%; box-sizing: border-box;\">\n\n      <div class=\"ms-g2\" style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 40px; border-bottom: 2px solid var(--color-divider); padding-bottom: 40px;\">\n        <div style=\"display: flex; flex-direction: column; gap: 16px; align-items: flex-start;\">\n          <div class=\"tag tag-accent\">{{ resultName }} — ТАНЫ LIFE SCORE<\u002Fdiv>\n          <div style=\"font-family: var(--font-heading); font-weight: 800; font-size: clamp(64px, 18vw, 120px); line-height: 1;\">{{ overall }}<span style=\"font-size: 32px; color: var(--color-neutral-500);\">/100<\u002Fspan><\u002Fdiv>\n          <div style=\"font-family: var(--font-heading); font-weight: 700; font-size: 24px; color: var(--color-accent-700);\">{{ scoreLabel }}<\u002Fdiv>\n          <sc-if value=\"{{ hasPrev }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display: flex; align-items: center; gap: 10px;\">\n              <span class=\"tag tag-neutral\">Өмнөх үнэлгээ ({{ prevDate }})<\u002Fspan>\n              <span style=\"font-family: var(--font-heading); font-weight: 800; font-size: 20px; color: {{ overallDeltaColor }};\">{{ overallDelta }} оноо<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <p style=\"font-size: 15px; color: var(--color-neutral-700); line-height: 1.6; margin: 0;\">{{ scoreDesc }}<\u002Fp>\n          <sc-if value=\"{{ hasPrev }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font-size: 12px; color: var(--color-neutral-600);\">Radar дээрх тасархай шугам — өмнөх үнэлгээ<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <svg sc-camel-view-box=\"-45 0 390 300\" style=\"width: 100%; height: auto;\">\n          <polygon points=\"150,30 234.9,65.1 270,150 234.9,234.9 150,270 65.1,234.9 30,150 65.1,65.1\" fill=\"none\" stroke=\"var(--color-neutral-300)\" stroke-width=\"1\"><\u002Fpolygon>\n          <polygon points=\"150,90 192.4,107.6 210,150 192.4,192.4 150,210 107.6,192.4 90,150 107.6,107.6\" fill=\"none\" stroke=\"var(--color-neutral-300)\" stroke-width=\"1\"><\u002Fpolygon>\n          <polygon points=\"{{ prevRadarPoints }}\" fill=\"none\" stroke=\"var(--color-neutral-500)\" stroke-width=\"1.5\" stroke-dasharray=\"5 4\" opacity=\"{{ prevRadarOpacity }}\"><\u002Fpolygon>\n          <polygon points=\"{{ radarPoints }}\" fill=\"var(--color-accent-200)\" fill-opacity=\"0.55\" stroke=\"var(--color-accent)\" stroke-width=\"2\"><\u002Fpolygon>\n          <text x=\"150\" y=\"20\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--color-neutral-700)\">Эрүүл мэнд<\u002Ftext>\n          <text x=\"244\" y=\"60\" text-anchor=\"start\" font-size=\"13\" fill=\"var(--color-neutral-700)\">Сэтгэл зүй<\u002Ftext>\n          <text x=\"278\" y=\"154\" text-anchor=\"start\" font-size=\"13\" fill=\"var(--color-neutral-700)\">Санхүү<\u002Ftext>\n          <text x=\"244\" y=\"248\" text-anchor=\"start\" font-size=\"13\" fill=\"var(--color-neutral-700)\">Карьер<\u002Ftext>\n          <text x=\"150\" y=\"290\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--color-neutral-700)\">Харилцаа<\u002Ftext>\n          <text x=\"56\" y=\"248\" text-anchor=\"end\" font-size=\"13\" fill=\"var(--color-neutral-700)\">Нийгэм<\u002Ftext>\n          <text x=\"22\" y=\"154\" text-anchor=\"end\" font-size=\"13\" fill=\"var(--color-neutral-700)\">Хөгжил<\u002Ftext>\n          <text x=\"56\" y=\"60\" text-anchor=\"end\" font-size=\"13\" fill=\"var(--color-neutral-700)\">Зорилго<\u002Ftext>\n        <\u002Fsvg>\n      <\u002Fdiv>\n\n      <!-- LOCKED / UNLOCKED DETAIL -->\n      <sc-if value=\"{{ locked }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"position: relative; margin-top: 40px;\">\n          <div class=\"ms-g3\" style=\"filter: blur(7px); pointer-events: none; user-select: none; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px;\">\n            <div class=\"card\" style=\"padding: 24px; height: 180px;\"><div class=\"card-kicker\">Давуу тал<\u002Fdiv><div style=\"margin-top: 12px; line-height: 1.8;\">Эрүүл мэнд — 84<br>Хөгжил — 78<br>Карьер — 72<\u002Fdiv><\u002Fdiv>\n            <div class=\"card\" style=\"padding: 24px; height: 180px;\"><div class=\"card-kicker\">Сул тал<\u002Fdiv><div style=\"margin-top: 12px; line-height: 1.8;\">Санхүү — 41<br>Нийгэм — 48<br>Зорилго — 55<\u002Fdiv><\u002Fdiv>\n            <div class=\"card\" style=\"padding: 24px; height: 180px;\"><div class=\"card-kicker\">Сарын зорилго<\u002Fdiv><div style=\"margin-top: 12px; line-height: 1.8;\">Долоо хоног бүр төсөв гаргаж, зарлагаа бүртгэх.<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"card elev-lg\" style=\"position: absolute; inset: 0; margin: auto; max-width: 520px; height: fit-content; padding: 32px; display: flex; flex-direction: column; gap: 12px; align-items: flex-start; border: 2px solid var(--color-text);\">\n            <div class=\"tag tag-accent\">🔒 БҮРЭН ТАЙЛАН ТҮГЖЭЭТЭЙ<\u002Fdiv>\n            <div style=\"font-family: var(--font-heading); font-weight: 800; font-size: 24px;\">AI бүрэн тайлангаа аваарай<\u002Fdiv>\n            <div style=\"font-size: 14px; color: var(--color-neutral-700); line-height: 1.6;\">Салбар бүрийн задаргаа, давуу/сул тал, эрсдэл, 30 хоногийн төлөвлөгөө — таны имэйл рүү илгээгдэнэ.<\u002Fdiv>\n            <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ openPay }}\" style=\"font-size: 16px; padding: 14px 24px;\">Тайлан авах — {{ priceFmt }}₮<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ unlockedView }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"margin-top: 40px; display: flex; flex-direction: column; gap: 32px;\">\n          <div class=\"card\" style=\"padding: 18px 24px; border-left: 4px solid var(--color-accent); display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap;\">\n            <div style=\"font-size: 14px;\">✓ Төлбөр амжилттай. Бүрэн тайлан (PDF) <b>{{ email }}<\u002Fb> хаяг руу илгээгдлээ.<\u002Fdiv>\n            <div class=\"tag tag-neutral\">#{{ orderNo }}<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div class=\"ms-g3\" style=\"display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px;\">\n            <div class=\"card\" style=\"padding: 24px;\">\n              <div class=\"card-kicker\" style=\"color: var(--color-accent-700);\">Давуу тал — TOP 3<\u002Fdiv>\n              <div style=\"margin-top: 14px; display: flex; flex-direction: column; gap: 10px;\">\n                <sc-for list=\"{{ strengths }}\" as=\"s\" hint-placeholder-count=\"3\">\n                  <div style=\"display: flex; justify-content: space-between; border-bottom: 1px solid var(--color-divider); padding-bottom: 8px;\"><span>{{ s.name }}<\u002Fspan><b>{{ s.score }}<\u002Fb><\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"card\" style=\"padding: 24px;\">\n              <div class=\"card-kicker\" style=\"color: var(--color-accent-700);\">Сул тал — TOP 3<\u002Fdiv>\n              <div style=\"margin-top: 14px; display: flex; flex-direction: column; gap: 10px;\">\n                <sc-for list=\"{{ weaknesses }}\" as=\"w\" hint-placeholder-count=\"3\">\n                  <div style=\"display: flex; justify-content: space-between; border-bottom: 1px solid var(--color-divider); padding-bottom: 8px;\"><span>{{ w.name }}<\u002Fspan><b style=\"color: var(--color-accent);\">{{ w.score }}<\u002Fb><\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"card\" style=\"padding: 24px;\">\n              <div class=\"card-kicker\" style=\"color: var(--color-accent-700);\">Тэнцвэрийн зөрүү<\u002Fdiv>\n              <div style=\"margin-top: 14px; font-family: var(--font-heading); font-weight: 800; font-size: 40px;\">{{ balance }}<span style=\"font-size: 16px; color: var(--color-neutral-500);\"> оноо<\u002Fspan><\u002Fdiv>\n              <div style=\"font-size: 13px; color: var(--color-neutral-600); margin-top: 6px;\">{{ balanceLabel }} — хамгийн өндөр ба бага онооны зөрүү. Зөрүү бага байх тусам амьдрал тогтвортой мэдрэгддэг.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <!-- FOCUS OF THE MONTH -->\n          <div class=\"card elev-md ms-g2\" style=\"padding: 32px; background: var(--color-accent-100); display: grid; grid-template-columns: 1fr 1.4fr; gap: 32px;\">\n            <div style=\"display: flex; flex-direction: column; gap: 12px; align-items: flex-start;\">\n              <div style=\"font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--color-accent-700);\">Энэ сарын онцлох зорилго<\u002Fdiv>\n              <div style=\"font-family: var(--font-heading); font-weight: 800; font-size: 32px; line-height: 1.15;\">{{ focusName }}<\u002Fdiv>\n              <div style=\"display: flex; align-items: baseline; gap: 8px;\"><span style=\"font-family: var(--font-heading); font-weight: 800; font-size: 48px; color: var(--color-accent-700);\">{{ focusScore }}<\u002Fspan><span style=\"font-size: 14px; color: var(--color-neutral-600);\">/100 — одоогийн оноо<\u002Fspan><\u002Fdiv>\n              <div style=\"border: 2px solid var(--color-accent); padding: 14px 16px; font-family: var(--font-heading); font-weight: 700; font-size: 17px; line-height: 1.4;\">{{ monthlyGoal }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n              <div style=\"font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--color-neutral-600);\">Яагаад яг энэ салбар вэ?<\u002Fdiv>\n              <p style=\"font-size: 15px; line-height: 1.7; margin: 0;\">{{ focusReason }}<\u002Fp>\n              <div style=\"font-size: 13px; color: var(--color-neutral-600); margin-top: auto;\">30 хоногийн дараа дахин үнэлгээ хийж ахицаа хэмжээрэй — нэг салбарт төвлөрсөн сар нийт оноог дунджаар 9–14 пунктээр өсгөдөг.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <!-- PILLAR BREAKDOWN -->\n          <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n            <div style=\"font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--color-accent-700);\">Салбар бүрийн дүгнэлт, зөвлөмж<\u002Fdiv>\n            <div class=\"ms-g2\" style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 16px;\">\n              <sc-for list=\"{{ pillarRows }}\" as=\"p\" hint-placeholder-count=\"8\">\n                <div class=\"card\" style=\"padding: 20px; display: flex; flex-direction: column; gap: 10px;\">\n                  <div style=\"display: flex; justify-content: space-between; align-items: baseline;\">\n                    <div style=\"font-weight: 700; font-size: 16px;\">{{ p.name }}<\u002Fdiv>\n                    <div style=\"display: flex; align-items: baseline; gap: 10px;\">\n                      <span style=\"font-size: 12px; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; color: {{ p.bandColor }};\">{{ p.band }}<\u002Fspan>\n                      <b style=\"font-family: var(--font-heading); font-size: 24px;\">{{ p.score }}<\u002Fb>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"height: 8px; background: var(--color-neutral-200);\"><div style=\"height: 8px; background: {{ p.barColor }}; width: {{ p.score }}%;\"><\u002Fdiv><\u002Fdiv>\n                  <div style=\"font-size: 13.5px; color: var(--color-neutral-700); line-height: 1.55;\">{{ p.advice }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <!-- MONTHLY COMPARISON -->\n          <sc-if value=\"{{ hasPrev }}\" hint-placeholder-val=\"{{ false }}\">\n            <div class=\"ms-g2\" style=\"display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px;\">\n              <div class=\"card\" style=\"padding: 24px;\">\n                <div class=\"card-kicker\" style=\"color: var(--color-accent-700); margin-bottom: 14px;\">Өмнөх сартай харьцуулбал<\u002Fdiv>\n                <div style=\"display: flex; flex-direction: column; gap: 8px;\">\n                  <sc-for list=\"{{ compareRows }}\" as=\"c\" hint-placeholder-count=\"8\">\n                    <div style=\"display: grid; grid-template-columns: 120px 1fr 90px; align-items: center; gap: 12px; font-size: 14px; border-bottom: 1px solid var(--color-divider); padding-bottom: 6px;\">\n                      <div>{{ c.name }}<\u002Fdiv>\n                      <div style=\"color: var(--color-neutral-600);\">{{ c.prev }} → <b style=\"color: var(--color-text);\">{{ c.cur }}<\u002Fb><\u002Fdiv>\n                      <div style=\"text-align: right; font-weight: 700; color: {{ c.deltaColor }};\">{{ c.arrow }} {{ c.delta }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div class=\"card\" style=\"padding: 24px;\">\n                <div class=\"card-kicker\" style=\"color: var(--color-accent-700); margin-bottom: 14px;\">Онооны түүх<\u002Fdiv>\n                <div style=\"display: flex; align-items: flex-end; gap: 12px; height: 100px;\">\n                  <sc-for list=\"{{ historyBars }}\" as=\"h\" hint-placeholder-count=\"3\">\n                    <div style=\"display: flex; flex-direction: column; align-items: center; gap: 4px;\">\n                      <b style=\"font-family: var(--font-heading); font-size: 13px;\">{{ h.overall }}<\u002Fb>\n                      <div style=\"width: 28px; background: var(--color-accent); height: {{ h.hPx }}px;\"><\u002Fdiv>\n                      <div style=\"font-size: 10px; color: var(--color-neutral-600);\">{{ h.label }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ noPrevNote }}\" hint-placeholder-val=\"{{ false }}\">\n            <div class=\"card\" style=\"padding: 20px 24px; border-left: 4px solid var(--color-accent); display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap;\">\n              <div style=\"font-size: 14px; line-height: 1.6;\"><b>📅 Дараагийн үнэлгээ — 30 хоногийн дараа.<\u002Fb><br><span style=\"color: var(--color-neutral-600);\">Дахин үнэлгээ хийхэд таны өмнөх оноо салбар бүрээр харьцуулагдаж, ахиц энд графикаар харагдана.<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <div class=\"card\" style=\"padding: 28px;\">\n            <div class=\"card-kicker\" style=\"color: var(--color-accent-700);\">AI дүгнэлт<\u002Fdiv>\n            <p style=\"font-size: 15px; line-height: 1.7; margin: 14px 0 0; white-space: pre-line;\">{{ aiSummary }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- PAYMENT PANEL -->\n      <sc-if value=\"{{ payOpen }}\" hint-placeholder-val=\"{{ false }}\">\n        <div class=\"dialog-backdrop\" style=\"position: fixed; inset: 0; background: rgba(32,30,29,.55); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 24px;\">\n          <div class=\"dialog elev-lg\" data-screen-label=\"Payment\" style=\"background: var(--color-bg); max-width: 780px; width: 100%; padding: 0; max-height: 90vh; overflow: auto;\">\n\n            <sc-if value=\"{{ payForm }}\" hint-placeholder-val=\"{{ true }}\">\n              <div class=\"ms-g2\" style=\"display: grid; grid-template-columns: 300px 1fr;\">\n                <div style=\"background: var(--color-neutral-100); border-right: 2px solid var(--color-divider); padding: 28px; display: flex; flex-direction: column; gap: 14px; align-items: flex-start;\">\n                  <div style=\"font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--color-neutral-600);\">QR уншуулж төлөх<\u002Fdiv>\n                  <img src=\"f0bee7eb-4e87-4c03-a793-54d996c93b39\" alt=\"Төлбөрийн QR\" style=\"width: 100%; border: 2px solid var(--color-text); display: block;\">\n                  <div style=\"font-family: var(--font-heading); font-weight: 800; font-size: 30px;\">{{ priceFmt }}₮<\u002Fdiv>\n                  <div style=\"font-size: 13px; color: var(--color-neutral-700); line-height: 1.6;\">Та банкныхаа аппыг нээж QPay-ээ уншуулж төлбөрөө төлнө үү. <b>Гүйлгээний утга дээр имэйл хаягаа оруулна уу.<\u002Fb><\u002Fdiv>\n                  <div style=\"border-top: 2px solid var(--color-divider); width: 100%; padding-top: 14px; display: flex; flex-direction: column; gap: 6px;\">\n                    <div style=\"font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--color-neutral-600);\">Эсвэл дансаар шилжүүлэх<\u002Fdiv>\n                    <div style=\"font-size: 13px;\"><b>ХасБанк<\u002Fb> · Ундрал<\u002Fdiv>\n                    <div style=\"display: flex; align-items: center; gap: 8px; width: 100%;\">\n                      <div style=\"font-family: var(--font-heading); font-weight: 700; font-size: 13px; letter-spacing: .02em; word-break: break-all;\">MN770032005001589646<\u002Fdiv>\n                      <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ copyAccount }}\" style=\"font-size: 12px; padding: 6px 10px; white-space: nowrap;\">{{ copyLabel }}<\u002Fbutton>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"padding: 28px; display: flex; flex-direction: column; gap: 18px; align-items: flex-start;\">\n                  <div style=\"display: flex; justify-content: space-between; width: 100%; align-items: flex-start;\">\n                    <div style=\"font-family: var(--font-heading); font-weight: 800; font-size: 24px;\">Бүрэн тайлан авах<\u002Fdiv>\n                    <button class=\"btn btn-ghost btn-icon\" sc-camel-on-click=\"{{ closePay }}\" style=\"font-size: 18px;\">✕<\u002Fbutton>\n                  <\u002Fdiv>\n                  <div style=\"font-size: 14px; color: var(--color-neutral-700); line-height: 1.6;\">Төлбөр баталгаажсны дараа AI бүрэн тайлан (PDF) доорх имэйл хаяг руу автоматаар илгээгдэнэ.<\u002Fdiv>\n                  <div class=\"field\" style=\"width: 100%;\"><label>Тайлан хүлээн авах имэйл<\u002Flabel><input class=\"input\" value=\"{{ email }}\" sc-camel-on-change=\"{{ setEmail }}\" placeholder=\"tany@email.mn\" type=\"email\"><\u002Fdiv>\n                  <sc-if value=\"{{ payError }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"font-size: 13px; color: var(--color-accent-700);\">{{ payError }}<\u002Fdiv>\n                  <\u002Fsc-if>\n                  <div style=\"border-top: 2px solid var(--color-divider); width: 100%; padding-top: 16px; display: flex; flex-direction: column; gap
